[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-ootb-devops-deploy-gate"
version = "0.1.0"
description = "OCI DevOps approval-gate pipeline template plus an offline pipeline checker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oci-ootb-devops-deploy-gate = "oci_ootb_devops_deploy_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
